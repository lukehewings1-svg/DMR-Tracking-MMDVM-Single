[gateway]
# Address of your DMR Tracker (https://dmr.yourclub.org or http://192.168.1.50:8001)
server_url = http://192.168.1.50:8001
# Key shown once when you add the gateway in Admin -> Voice gateways
gateway_key = paste-the-key-here
# DMR ID programmed into the DMR818 (shown in the admin panel)
radio_id = 2340001

serial_port = /dev/serial0
serial_baud = 57600

# USB sound card - list cards with: arecord -l   (card 1 -> plughw:1,0)
audio_device = plughw:1,0

# Seconds to hold dispatcher audio after keying up (module call set-up time)
tx_key_delay = 0.3
# Seconds to keep transmitting after the dispatcher releases PTT
tx_hang = 0.25
